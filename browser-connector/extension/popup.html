<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Signal Desk 连接器</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <div class="brand"><span>SD</span><strong>Signal Desk</strong></div>
      <p id="status">正在检查连接…</p>
      <div class="meter"><i id="meter"></i></div>
      <button id="connect">重新连接桌面端</button>
      <button id="following" class="secondary">打开抖音关注页</button>
      <small>只读取当前浏览器公开可见内容；不会导出 Cookie、密码或令牌。</small>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
